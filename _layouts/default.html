<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Простыми словами</title>
  <meta name="description" content="Документы Telegram-бота «Простыми словами»: публичная оферта и условия возврата.">
  <link rel="icon" href="{{ '/assets/day-96.webp' | relative_url }}?v=20261014b" type="image/webp">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261014b">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="https://chasovoy.pro/">
        <img class="logo-day" src="{{ '/assets/day-96.webp' | relative_url }}?v=20261014b" alt="" width="40" height="40">
        <img class="logo-night" src="{{ '/assets/night-96.webp' | relative_url }}?v=20261014b" alt="" width="40" height="40">
        <span>Простыми словами</span>
      </a>
      <nav>
        <a href="{{ '/offer/' | relative_url }}">Оферта</a>
        <a href="{{ '/refund/' | relative_url }}">Возврат</a>
        <a href="{{ '/policy/' | relative_url }}">Данные</a>
        <button class="theme" id="theme" type="button">авто</button>
        <a class="btn" href="https://t.me/prostymy_slovamy_bot">Открыть бота</a>
      </nav>
    </div>
  </header>

  <main class="wrap doc">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>Исполнитель:</strong> Сецкий Иван Васильевич, ИНН 511201570210, самозанятый (плательщик НПД).</p>
      <p>Обращения: <a href="mailto:16-salable-via@icloud.com">16-salable-via@icloud.com</a> или кнопка «Техподдержка» в боте.</p>
    </div>
  </footer>
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme"), modes = ["auto", "light", "dark"], names = {auto: "авто", light: "светлая", dark: "тёмная"}, mode = "auto";
      try { mode = localStorage.getItem("theme") || "auto"; } catch (e) {}
      function apply() { if (mode === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
        btn.textContent = names[mode]; btn.setAttribute("aria-label", "Тема: " + names[mode] + ", нажмите, чтобы переключить"); }
      btn.onclick = function () { mode = modes[(modes.indexOf(mode) + 1) % 3]; try { localStorage.setItem("theme", mode); } catch (e) {} apply(); };
      apply();
    })();
  </script>
</body>
</html>
